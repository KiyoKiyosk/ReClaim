<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>ReClaim - Log in</title>
  <link rel='stylesheet' href='css/style.css'>
</head>
<body>
  <main class='card'>
    <img class='logo-big' src='images/lspu-logo.png' alt='LSPU logo'>
    <h1>Log in</h1>
    <form id='login-form'>
      <input id='email' type='email' placeholder='School email' required>
      <input id='password' type='password' placeholder='Password' required>
      <button type='submit'>Log in</button>
      <p id='msg' class='error'></p>
    </form>
    <p><a href='#' id='forgot'>Forgot password?</a></p>
    <p>No account yet? <a href='signup.html'>Sign up</a></p>
  </main>
  <script type='module' src='js/login.js'></script>
</body>
</html>
