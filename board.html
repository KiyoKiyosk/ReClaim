<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>ReClaim - Board</title>
  <link rel='stylesheet' href='css/style.css'>
</head>
<body>
  <header>
    <img class='logo' src='images/lspu-logo.png' alt='LSPU logo'>
    <h1>ReClaim</h1>
    <a id='admin-link' href='admin.html' hidden>Admin</a>
    <button id='logout'>Log out</button>
  </header>
  <main>
    <p>Found something of yours? Bring proof of ownership to the office to claim it.</p>
    <input id='search' placeholder='Search items'>
    <select id='category'>
      <option value='all'>All categories</option>
      <option value='IDs and Cards'>IDs and Cards</option>
      <option value='Wallets'>Wallets</option>
      <option value='Bags'>Bags</option>
      <option value='Gadgets'>Gadgets</option>
      <option value='Keys'>Keys</option>
      <option value='Books and Supplies'>Books and Supplies</option>
      <option value='Bottles and Lunch'>Bottles and Lunch</option>
      <option value='Clothing and Accessories'>Clothing and Accessories</option>
      <option value='Umbrellas'>Umbrellas</option>
      <option value='Other'>Other</option>
    </select>
    <div id='grid' class='grid'></div>
  </main>
  <script type='module' src='js/board.js'></script>
</body>
</html>
