<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>ReClaim - Board</title>
  <link rel='stylesheet' href='css/style.css'>
</head>
<body>
  <header>
    <h1>ReClaim</h1>
    <a id='admin-link' href='admin.html' hidden>Admin</a>
    <button id='logout'>Log out</button>
  </header>
  <main>
    <p>Found something of yours? Bring proof of ownership to the office to claim it.</p>
    <input id='search' placeholder='Search items'>
    <select id='category'>
      <option value='all'>All categories</option>
      <option value='ID'>ID</option>
      <option value='Umbrella'>Umbrella</option>
      <option value='Calculator'>Calculator</option>
      <option value='Bottle'>Bottle</option>
      <option value='Bag'>Bag</option>
      <option value='Other'>Other</option>
    </select>
    <div id='grid' class='grid'></div>
  </main>
  <script type='module' src='js/board.js'></script>
</body>
</html>
